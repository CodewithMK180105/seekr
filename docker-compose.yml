services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: seekr-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seekr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seekr_secret}
      POSTGRES_DB: ${POSTGRES_DB:-seekr_db}
    volumes:
      - seekr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seekr} -d ${POSTGRES_DB:-seekr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seekr-network

  redis:
    image: redis:7-alpine
    container_name: seekr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - seekr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - seekr-network

volumes:
  seekr_postgres_data:
  seekr_redis_data:

networks:
  seekr-network:
    driver: bridge
